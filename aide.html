<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aide Yop2D</title>
<meta name="description" content="Documentation des nœuds et guides d'utilisation de Yop2D, moteur de jeu 2D sans code pour Android.">
<link rel="canonical" href="https://zinzin66.github.io/Yop2d-web/aide.html">
<style>
/* Palette du moteur Yop2D (Palette.java) */
:root { --background: #1A1F26; --entete: #242A33; --card: #252B33; --survol: #2F3B45; --bordure: #3A4048; --fond-sombre: #161A20; --text: #ECEEF0; --text-dim: #9AA0A8; --teal: #5DCAA5; --bleu: #85B7EB; --ambre: #FAC775; }
* { box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; line-height: 1.6; color: var(--text); background: var(--background); margin: 0; }
header { background: var(--entete); border-bottom: 1px solid var(--bordure); color: white; padding: 1.25rem 1rem; text-align: center; }
header h1 { font-size: 1.4rem; margin: 0.3rem 0; }
main { max-width: 800px; margin: 0 auto; padding: 1rem; }

.tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; position: sticky; top: 0; background: var(--background); padding: 0.5rem 0; z-index: 5; }
.tab-btn { flex: 1; padding: 0.7rem; border: 1px solid var(--bordure); border-radius: 8px; background: var(--card); color: var(--text-dim); font-size: 1rem; font-weight: bold; cursor: pointer; }
.tab-btn.active { background: var(--survol); color: var(--teal); border-color: var(--teal); }

.tab-content { display: none; }
.tab-content.active { display: block; }

.categorie { background: var(--card); border: 1px solid var(--bordure); border-radius: 10px; margin-bottom: 0.75rem; overflow: hidden; }
.categorie > summary { padding: 0.9rem 1rem; font-weight: bold; color: var(--ambre); cursor: pointer; font-size: 1.05rem; list-style: none; display: flex; justify-content: space-between; align-items: center; }
.categorie > summary::-webkit-details-marker { display: none; }
.categorie > summary::after { content: "+"; font-size: 1.3rem; color: var(--text-dim); }
.categorie[open] > summary::after { content: "−"; }
.categorie-body { padding: 0 1rem 0.5rem 1rem; }

.noeud { border-top: 1px solid var(--bordure); padding: 0.9rem 0; }
.noeud:first-child { border-top: none; }
.noeud-nom { color: white; font-weight: bold; font-size: 1rem; margin-bottom: 0.35rem; }
.schema { font-size: 0.85rem; color: var(--text-dim); background: var(--fond-sombre); border-radius: 6px; padding: 0.5rem 0.7rem; margin-bottom: 0.5rem; }
.schema b { color: var(--bleu); }
.role { margin: 0.3rem 0; }
.exemple { color: var(--text-dim); font-size: 0.95rem; }
.exemple b { color: var(--teal); }

.guide-item { display: block; background: var(--card); border: 1px solid var(--bordure); border-radius: 10px; padding: 1rem; margin-bottom: 0.75rem; text-decoration: none; color: var(--text); }
.guide-item .titre { color: white; font-weight: bold; display: block; margin-bottom: 0.25rem; }
.guide-item .desc { color: var(--text-dim); font-size: 0.9rem; }

.message { text-align: center; color: var(--text-dim); padding: 1.5rem; font-style: italic; }

footer { text-align: center; padding: 1.5rem; color: var(--text-dim); font-size: 0.85rem; }
footer a { color: var(--teal); }

@media (max-width: 480px) { header h1 { font-size: 1.2rem; } }
header { position: relative; }
.langue { position: absolute; top: 0.6rem; right: 0.6rem; }
.langue select { background: var(--card); color: var(--text); border: 1px solid var(--bordure); border-radius: 6px; padding: 0.3rem 0.4rem; font-size: 0.9rem; }
.langue option { color: var(--text); background: var(--card); }
@media (max-width: 480px) { header { padding-top: 2.6rem; } }
</style>
</head>
<body>
<header>
<div class="langue">
<select id="choix-langue" aria-label="Langue / Language" onchange="changerLangue(this.value)">
<option value="fr">🇫🇷 Français</option>
<option value="en">🇬🇧 English</option>
<option value="es">🇪🇸 Español</option>
<option value="de">🇩🇪 Deutsch</option>
<option value="it">🇮🇹 Italiano</option>
<option value="pt">🇵🇹 Português</option>
<option value="ru">🇷🇺 Русский</option>
<option value="zh">🇨🇳 中文</option>
<option value="ja">🇯🇵 日本語</option>
</select>
</div>
<h1 id="txt-titre">Aide Yop2D</h1>
<p id="txt-sous-titre" style="margin:0;opacity:0.9;font-size:0.9rem;">Documentation des nœuds et guides</p>
</header>
<main>

<div class="tabs">
<button class="tab-btn active" id="btn-noeuds" onclick="ouvrirOnglet('noeuds')">Nœuds</button>
<button class="tab-btn" id="btn-guides" onclick="ouvrirOnglet('guides')">Guides</button>
</div>

<div class="tab-content active" id="tab-noeuds">
<p id="txt-intro" style="color:var(--text-dim);font-size:0.9rem;">Chaque nœud est un bloc que tu peux brancher dans le Blueprint. Les <b>entrées</b> sont ce que tu configures ou branches avant, la <b>sortie</b> est la suite de l'action.</p>
<div id="contenu-noeuds"><p class="message">Chargement...</p></div>
<p style="text-align:center;margin-top:1rem;"><a id="lien-reference" href="noeuds/fr.html" style="color:var(--teal);">Voir tous les nœuds sur une seule page</a></p>
</div>

<div class="tab-content" id="tab-guides">
<div id="contenu-guides"><p class="message">Chargement...</p></div>
</div>

</main>
<footer>
<p>Yop2D · <a href="index.html" id="txt-site">Site officiel</a></p>
</footer>

// Choix de la langue : 1) ?lang= dans l'adresse (envoyé par le moteur), 2) dernier choix, 3) langue du téléphone, 4) français
function langueDeDepart() {
  const depuisAdresse = new URLSearchParams(window.location.search).get('lang');
  if (depuisAdresse && LANGUES.includes(depuisAdresse.slice(0, 2).toLowerCase())) return depuisAdresse.slice(0, 2).toLowerCase();
  try {
    const memorisee = localStorage.getItem('yop2d-aide-langue');
    if (memorisee && LANGUES.includes(memorisee)) return memorisee;
  } catch (e) {}
  const telephone = (navigator.language || 'fr').slice(0, 2).toLowerCase();
  return LANGUES.includes(telephone) ? telephone : 'fr';
}

let langue = langueDeDepart();

function t(cle) { return (TEXTES[langue] || TEXTES.fr)[cle]; }

function changerLangue(nouvelle) {
  langue = nouvelle;
  try { localStorage.setItem('yop2d-aide-langue', langue); } catch (e) {}
  const adresse = new URL(window.location.href);
  adresse.searchParams.set('lang', langue);
  history.replaceState(null, '', adresse);
  toutAfficher();
}

function traduirePage() {
  document.documentElement.lang = langue;
  document.title = t('titre');
  document.getElementById('choix-langue').value = langue;
  document.getElementById('txt-titre').textContent = t('titre');
  document.getElementById('txt-sous-titre').textContent = t('sousTitre');
  document.getElementById('btn-noeuds').textContent = t('noeuds');
  document.getElementById('btn-guides').textContent = t('guides');
  document.getElementById('txt-intro').innerHTML = t('intro');
  document.getElementById('txt-site').textContent = t('site');
  document.getElementById('lien-reference').textContent = t('reference');
  document.getElementById('lien-reference').href = 'noeuds/' + langue + '.html';
}

function ouvrirOnglet(nom) {
  document.getElementById('tab-noeuds').classList.toggle('active', nom === 'noeuds');
  document.getElementById('tab-guides').classList.toggle('active', nom === 'guides');
  document.getElementById('btn-noeuds').classList.toggle('active', nom === 'noeuds');
  document.getElementById('btn-guides').classList.toggle('active', nom === 'guides');
}
if (window.location.hash === '#guides') { ouvrirOnglet('guides'); }

function echapper(txt) {
  const d = document.createElement('div');
  d.textContent = txt || '';
  return d.innerHTML;
}

async function listerFichiers(dossier) {
  const reponse = await fetch(`https://api.github.com/repos/${DEPOT}/contents/${dossier}`);
  if (!reponse.ok) throw new Error("dossier introuvable");
  const liste = await reponse.json();
  return liste
    .filter(f => f.type === 'file' && f.name.endsWith('.json'))
    .sort((a, b) => a.name.localeCompare(b.name));
}

// Cherche les fichiers dans le dossier de la langue ; s'il est vide ou absent, prend le français
async function listerFichiersLangue(dossier) {
  if (langue !== 'fr') {
    try {
      const fichiers = await listerFichiers(`${dossier}/${langue}`);
      if (fichiers.length > 0) return fichiers;
    } catch (e) {}
  }
  return listerFichiers(`${dossier}/fr`);
}

async function chargerNoeuds() {
  const conteneur = document.getElementById('contenu-noeuds');
  conteneur.innerHTML = `<p class="message">${echapper(t('chargement'))}</p>`;
  try {
    const fichiers = await listerFichiersLangue('aide/noeuds');
    if (fichiers.length === 0) { conteneur.innerHTML = `<p class="message">${echapper(t('aucunNoeud'))}</p>`; return; }
    conteneur.innerHTML = '';
    for (const [index, fichier] of fichiers.entries()) {
      const data = await (await fetch(fichier.download_url)).json();
      const details = document.createElement('details');
      details.className = 'categorie';
      if (index === 0) details.open = true;
      const summary = document.createElement('summary');
      summary.textContent = data.categorie || fichier.name;
      details.appendChild(summary);
      const body = document.createElement('div');
      body.className = 'categorie-body';
      (data.noeuds || []).forEach(n => {
        const div = document.createElement('div');
        div.className = 'noeud';
        div.innerHTML = `
          <div class="noeud-nom">${echapper(n.nom)}</div>
          ${n.schema ? `<div class="schema">${n.schema}</div>` : ''}
          ${n.role ? `<div class="role">${echapper(n.role)}</div>` : ''}
          ${n.exemple ? `<div class="exemple"><b>${echapper(t('exemple'))}</b> ${echapper(n.exemple)}</div>` : ''}
        `;
        body.appendChild(div);
      });
      details.appendChild(body);
      conteneur.appendChild(details);
    }
  } catch (e) {
    conteneur.innerHTML = `<p class="message">${echapper(t('erreurNoeuds'))}</p>`;
  }
}

async function chargerGuides() {
  const conteneur = document.getElementById('contenu-guides');
  conteneur.innerHTML = `<p class="message">${echapper(t('chargement'))}</p>`;
  try {
    const fichiers = await listerFichiersLangue('aide/guides');
    if (fichiers.length === 0) { conteneur.innerHTML = `<p class="message">${echapper(t('aucunGuide'))}</p>`; return; }
    conteneur.innerHTML = '';
    for (const fichier of fichiers) {
      const data = await (await fetch(fichier.download_url)).json();
      const a = document.createElement('a');
      a.className = 'guide-item';
      a.href = data.lien;
      a.innerHTML = `<span class="titre">${echapper(data.titre)}</span><span class="desc">${echapper(data.description)}</span>`;
      conteneur.appendChild(a);
    }
  } catch (e) {
    conteneur.innerHTML = `<p class="message">${echapper(t('erreurGuides'))}</p>`;
  }
}

function toutAfficher() {
  traduirePage();
  chargerNoeuds();
  chargerGuides();
}

toutAfficher();
</script>
